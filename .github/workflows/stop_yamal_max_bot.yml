name: Stop Yamal MAX Bot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stop:
    runs-on: [self-hosted, linux, yamal-botsgsn]
    env:
      BOTSGSN_PASSWORD: ${{ secrets.BOTSGSN_PASSWORD }}
      BRAND_DEPLOY_DIR: /home/localadmin/yamal_brand
      BRAND_SERVICE_NAME: max_yamal_bot.service
      YAMALBREND_DEPLOY_DIR: /home/localadmin/yamalbrend_bot
      YAMALBREND_SERVICE_NAME: yamalbrend_bot.service
      OLD_DEPLOY_DIR: /home/sergey/yamal_brand
    steps:
      - name: Stop BOTSGSN legacy Yamal bot services
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${BOTSGSN_PASSWORD}"
          echo "[stop] host=$(hostname) user=$(id -un)"

          sudo_cmd=(sudo -n)
          if ! sudo -n true >/dev/null 2>&1; then
            test -n "${BOTSGSN_PASSWORD}" || { echo "Missing sudo access and BOTSGSN_PASSWORD secret" >&2; exit 1; }
            sudo_cmd=(sudo -S)
          fi

          run_sudo() {
            if [[ "${sudo_cmd[*]}" == "sudo -S" ]]; then
              printf '%s\n' "${BOTSGSN_PASSWORD}" | "${sudo_cmd[@]}" "$@"
            else
              "${sudo_cmd[@]}" "$@"
            fi
          }

          for service in "${BRAND_SERVICE_NAME}" "${YAMALBREND_SERVICE_NAME}"; do
            run_sudo systemctl disable --now "${service}" || true
          done

          for deploy_dir in "${BRAND_DEPLOY_DIR}" "${YAMALBREND_DEPLOY_DIR}" "${OLD_DEPLOY_DIR}"; do
            env_file="${deploy_dir}/max_bot_sqlite/.env"
            if run_sudo test -f "${env_file}"; then
              run_sudo cp "${env_file}" "${env_file}.disabled.$(date -u +%Y%m%d%H%M%S)" || true
              run_sudo sed -i -E "s/^MAX_BOT_TOKEN=.*/MAX_BOT_TOKEN=disabled-yamal-token/" "${env_file}" || true
            fi
          done

          run_sudo pkill -f "${BRAND_DEPLOY_DIR}/max_bot_sqlite/src/bot.js" || true
          run_sudo pkill -f "${YAMALBREND_DEPLOY_DIR}/max_bot_sqlite/src/bot.js" || true
          run_sudo pkill -f "${OLD_DEPLOY_DIR}/max_bot_sqlite/src/bot.js" || true

          for service in "${BRAND_SERVICE_NAME}" "${YAMALBREND_SERVICE_NAME}"; do
            run_sudo systemctl status "${service}" --no-pager -n 30 || true
          done
          pgrep -af "max_bot_sqlite/src/bot.js" || true
