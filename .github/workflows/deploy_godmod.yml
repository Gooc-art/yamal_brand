name: Deploy Godmod Bot via Yamal Runner

on:
  workflow_dispatch:

concurrency:
  group: deploy-godmod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, yamal-max-prod]
    env:
      DEPLOY_DIR: /home/sergey/godmod
      DEPLOY_SERVICE: godmod-bot.service

    steps:
      - name: Checkout godmod repository
        uses: actions/checkout@v4
        with:
          repository: Gooc-art/godmod
          ref: main
          path: godmod-source

      - name: Sync repository to deploy path
        run: |
          mkdir -p "${DEPLOY_DIR}"
          rsync -az --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".venv/" \
            --exclude "venv/" \
            --exclude ".pytest_cache/" \
            --exclude "output/" \
            --exclude ".env" \
            ./godmod-source/ "${DEPLOY_DIR}/"

      - name: Prepare environment
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.GODMOD_TELEGRAM_BOT_TOKEN }}
          VK_SERVICE_TOKEN: ${{ secrets.GODMOD_VK_SERVICE_TOKEN }}
        run: |
          cd "${DEPLOY_DIR}"
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          python3 - <<'PY'
import os
from pathlib import Path

env_path = Path(".env")
lines = env_path.read_text(encoding="utf-8").splitlines()
updates = {
    "TELEGRAM_BOT_TOKEN": os.environ["TELEGRAM_BOT_TOKEN"],
    "VK_SERVICE_TOKEN": os.environ["VK_SERVICE_TOKEN"],
    "VK_API_TOKEN": "",
    "GODMOD_USE_MOCK_DATA": "false",
    "GODMOD_OUTPUT_DIR": "output",
}
seen = set()
result = []
for line in lines:
    if "=" not in line or line.lstrip().startswith("#"):
        result.append(line)
        continue
    key, _value = line.split("=", 1)
    if key in updates:
        result.append(f"{key}={updates[key]}")
        seen.add(key)
    else:
        result.append(line)
for key, value in updates.items():
    if key not in seen:
        result.append(f"{key}={value}")
env_path.write_text("\n".join(result) + "\n", encoding="utf-8")
PY

      - name: Normalize systemd unit paths
        run: |
          sed -i "s#/opt/godmod#${DEPLOY_DIR}#g" "${DEPLOY_DIR}/systemd/godmod-bot.service"

      - name: Deploy on runner host
        run: |
          chmod +x "${DEPLOY_DIR}/scripts/deploy_remote.sh"
          DEPLOY_DIR="${DEPLOY_DIR}" DEPLOY_SERVICE="${DEPLOY_SERVICE}" bash "${DEPLOY_DIR}/scripts/deploy_remote.sh"
