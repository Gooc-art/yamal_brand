name: Deploy Branding Calculator Static Frontend

on:
  workflow_dispatch:
    inputs:
      branding_ref:
        description: "Branch, tag, or SHA from Gooc-art/branding-calculator"
        required: true
        default: "design-layouts-refresh"

concurrency:
  group: deploy-branding-calculator-static
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branding calculator
        uses: actions/checkout@v4
        with:
          repository: Gooc-art/branding-calculator
          ref: ${{ inputs.branding_ref }}
          token: ${{ secrets.GODMOD_REPO_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: branding-calculator-frontend/package-lock.json

      - name: Install dependencies
        working-directory: branding-calculator-frontend
        run: npm ci

      - name: Build frontend
        working-directory: branding-calculator-frontend
        run: npm run build

      - name: Install deploy tools
        run: sudo apt-get update && sudo apt-get install -y rsync sshpass

      - name: Deploy to REG.RU
        env:
          REMOTE_HOST: ${{ secrets.REGRU_HOST }}
          REMOTE_USER: ${{ secrets.REGRU_USER }}
          REMOTE_DIR: ${{ secrets.REGRU_TARGET_DIR }}
          SSH_PASSWORD: ${{ secrets.REGRU_PASSWORD }}
          SSH_PORT: 22
        timeout-minutes: 15
        run: |
          set -euo pipefail

          DIST_DIR="branding-calculator-frontend/dist/branding-calculator-frontend/browser"
          export DIST_DIR REMOTE_HOST REMOTE_USER SSH_PASSWORD

          python3 - <<'PY'
          import ftplib
          import mimetypes
          import os
          from pathlib import Path

          dist = Path(os.environ["DIST_DIR"]).resolve()
          host = os.environ["REMOTE_HOST"]
          user = os.environ["REMOTE_USER"]
          password = os.environ["SSH_PASSWORD"]
          target = "/www/aieasytable.ru"

          def ensure_dir(ftp, path):
              if not path or path == ".":
                  return
              current = ""
              for part in path.split("/"):
                  if not part:
                      continue
                  current = f"{current}/{part}" if current else part
                  try:
                      ftp.mkd(current)
                  except ftplib.error_perm:
                      pass

          files = [p for p in dist.rglob("*") if p.is_file()]
          files.sort(key=lambda p: (p.name == "index.html", str(p)))

          with ftplib.FTP(host, timeout=45) as ftp:
              ftp.login(user, password)
              ftp.cwd(target)

              uploaded = 0
              for path in files:
                  rel = path.relative_to(dist).as_posix()
                  parent = str(Path(rel).parent).replace("\\", "/")
                  if parent != ".":
                      ensure_dir(ftp, parent)
                  with path.open("rb") as fh:
                      ftp.storbinary(f"STOR {rel}", fh)
                  uploaded += 1

          print(f"Uploaded {uploaded} files to FTP {target}")
          PY
