name: Deploy Branding Calculator Static Frontend

on:
  workflow_dispatch:
    inputs:
      branding_ref:
        description: "Branch, tag, or SHA from Gooc-art/branding-calculator"
        required: true
        default: "design-layouts-refresh"

concurrency:
  group: deploy-branding-calculator-static
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branding calculator
        uses: actions/checkout@v4
        with:
          repository: Gooc-art/branding-calculator
          ref: ${{ inputs.branding_ref }}
          token: ${{ secrets.GODMOD_REPO_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: branding-calculator-frontend/package-lock.json

      - name: Install dependencies
        working-directory: branding-calculator-frontend
        run: npm ci

      - name: Build frontend
        working-directory: branding-calculator-frontend
        run: npm run build

      - name: Install deploy tools
        run: sudo apt-get update && sudo apt-get install -y rsync sshpass

      - name: Deploy to REG.RU
        env:
          REMOTE_HOST: ${{ secrets.REGRU_HOST }}
          REMOTE_USER: ${{ secrets.REGRU_USER }}
          REMOTE_DIR: ${{ secrets.REGRU_TARGET_DIR }}
          SSH_PASSWORD: ${{ secrets.REGRU_PASSWORD }}
          SSH_PORT: 22
        timeout-minutes: 15
        run: |
          set -euo pipefail

          DIST_DIR="branding-calculator-frontend/dist/branding-calculator-frontend/browser"
          TIMESTAMP="$(date +%Y%m%d-%H%M%S)"
          SSH_OPTS="-p ${SSH_PORT} -o StrictHostKeyChecking=no -o ConnectTimeout=15"
          CANONICAL_DIR="/var/www/${REMOTE_USER}/data/www/aieasytable.ru"

          export SSHPASS="${SSH_PASSWORD}"

          LIVE_DIR="$(
            sshpass -e ssh ${SSH_OPTS} "${REMOTE_USER}@${REMOTE_HOST}" \
              'set -e
               canonical="/var/www/'"${REMOTE_USER}"'/data/www/aieasytable.ru"
               configured="'"${REMOTE_DIR}"'"
               found="$(find "$HOME" /var/www /www -maxdepth 9 -type f -name index.html -not -path "*/_backup/*" -exec grep -l "main-DHCVE66B\|main-7NJNZ5PN\|styles-KW4JF7R5" {} \; 2>/dev/null | head -n 1 || true)"
               if [ -n "$found" ]; then
                 dirname "$found"
                 exit 0
               fi
               if [ -f "$configured/index.html" ]; then
                 printf "%s\n" "$configured"
                 exit 0
               fi
               if [ -f "$canonical/index.html" ]; then
                 printf "%s\n" "$canonical"
                 exit 0
               fi
               printf "%s\n" "$configured"'
          )"

          if [ -z "${LIVE_DIR}" ]; then
            echo "Could not resolve live directory" >&2
            exit 1
          fi

          sshpass -e ssh ${SSH_OPTS} "${REMOTE_USER}@${REMOTE_HOST}" \
            "mkdir -p '${LIVE_DIR}/_backup/${TIMESTAMP}'"

          rsync -az --delete \
            --info=progress2 \
            --backup \
            --backup-dir="${LIVE_DIR}/_backup/${TIMESTAMP}" \
            -e "sshpass -e ssh ${SSH_OPTS}" \
            --exclude '_backup/' \
            "${DIST_DIR}/" "${REMOTE_USER}@${REMOTE_HOST}:${LIVE_DIR}/"

          echo "Deployed ${DIST_DIR} to REG.RU live directory"
