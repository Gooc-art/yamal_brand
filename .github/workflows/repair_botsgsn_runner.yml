name: Repair BOTSGSN GitHub Runner

on:
  workflow_dispatch:
    inputs:
      runner_dir:
        description: "Runner directory on BOTSGSN"
        required: false
        default: "/home/maxbot/actions-runner-yamal-brand"
      registration_token:
        description: "Short-lived GitHub runner registration token"
        required: true
      ssh_user:
        description: "SSH user on BOTSGSN"
        required: false
        default: "localadmin"

permissions:
  contents: read

concurrency:
  group: repair-botsgsn-runner
  cancel-in-progress: false

jobs:
  repair:
    runs-on: [self-hosted, linux, yamal-max-prod]
    env:
      BOTSGSN_HOST: 10.10.68.10
      BOTSGSN_USER: ${{ github.event.inputs.ssh_user || 'localadmin' }}
      BOTSGSN_PASSWORD: ${{ secrets.BOTSGSN_PASSWORD }}
      BOTSGSN_SUDO_PASSWORD: ${{ secrets.BOTSGSN_SUDO_PASSWORD }}
      RUNNER_DIR: ${{ github.event.inputs.runner_dir || '/home/maxbot/actions-runner-yamal-brand' }}
      RUNNER_REG_TOKEN: ${{ github.event.inputs.registration_token }}
      TARGET_RUNNER_NAME: BOTSGSN
      RUNNER_LABELS: yamal-botsgsn
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${BOTSGSN_PASSWORD}"
          echo "::add-mask::${BOTSGSN_SUDO_PASSWORD}"
          echo "::add-mask::${RUNNER_REG_TOKEN}"
          test -n "${BOTSGSN_PASSWORD}" || { echo "Missing secret BOTSGSN_PASSWORD" >&2; exit 1; }
          test -n "${BOTSGSN_SUDO_PASSWORD}" || { echo "Missing secret BOTSGSN_SUDO_PASSWORD" >&2; exit 1; }
          test -n "${RUNNER_DIR}"
          test -n "${RUNNER_REG_TOKEN}" || { echo "Missing registration_token input" >&2; exit 1; }

      - name: Prepare SSH helpers
        shell: bash
        run: |
          set -euo pipefail
          askpass="${RUNNER_TEMP}/botsgsn_askpass.sh"
          cat >"${askpass}" <<'EOF'
          #!/usr/bin/env sh
          printf '%s\n' "$BOTSGSN_PASSWORD"
          EOF
          chmod 700 "${askpass}"
          echo "SSH_ASKPASS=${askpass}" >> "${GITHUB_ENV}"
          echo "SSH_ASKPASS_REQUIRE=force" >> "${GITHUB_ENV}"
          echo "DISPLAY=none" >> "${GITHUB_ENV}"

      - name: Reconfigure BOTSGSN runner over SSH
        shell: bash
        run: |
          set -euo pipefail
          sudo_password_b64="$(printf '%s' "${BOTSGSN_SUDO_PASSWORD}" | base64 | tr -d '\n')"
          remote_env="BOTSGSN_SUDO_PASSWORD_B64=$(printf '%q' "${sudo_password_b64}") RUNNER_DIR=$(printf '%q' "${RUNNER_DIR}") TARGET_RUNNER_NAME=$(printf '%q' "${TARGET_RUNNER_NAME}") RUNNER_LABELS=$(printf '%q' "${RUNNER_LABELS}") RUNNER_REG_TOKEN=$(printf '%q' "${RUNNER_REG_TOKEN}") GITHUB_REPOSITORY=$(printf '%q' "${GITHUB_REPOSITORY}")"
          setsid -w ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            "${BOTSGSN_USER}@${BOTSGSN_HOST}" \
            "${remote_env} bash -s" <<'REMOTE'
          set -euo pipefail

          sudo_run() {
            if [ "$(id -u)" = "0" ]; then
              "$@"
            else
              { printf '%s' "${BOTSGSN_SUDO_PASSWORD_B64}" | base64 -d; printf '\n'; } | sudo -S "$@"
            fi
          }

          sudo_run true
          sudo_run test -x "${RUNNER_DIR}/config.sh"
          sudo_run test -x "${RUNNER_DIR}/svc.sh"
          runner_user="$(sudo_run stat -c '%U' "${RUNNER_DIR}")"

          sudo_run bash -lc "cd '${RUNNER_DIR}' && ./svc.sh stop || true"
          sudo_run bash -lc "cd '${RUNNER_DIR}' && ./svc.sh uninstall || true"
          sudo_run systemctl daemon-reload
          sudo_run rm -f \
            "${RUNNER_DIR}/.runner" \
            "${RUNNER_DIR}/.credentials" \
            "${RUNNER_DIR}/.credentials_rsaparams" \
            "${RUNNER_DIR}/.service"
          sudo_run chown -R "${runner_user}:${runner_user}" "${RUNNER_DIR}"

          sudo_run -u "${runner_user}" bash -lc "cd '${RUNNER_DIR}' && ./config.sh --url 'https://github.com/${GITHUB_REPOSITORY}' --token '${RUNNER_REG_TOKEN}' --name '${TARGET_RUNNER_NAME}' --labels '${RUNNER_LABELS}' --work _work --unattended --replace"
          sudo_run bash -lc "cd '${RUNNER_DIR}' && ./svc.sh install '${runner_user}'"
          sudo_run systemctl daemon-reload
          sudo_run bash -lc "cd '${RUNNER_DIR}' && ./svc.sh start"
          sudo_run systemctl status "actions.runner.${GITHUB_REPOSITORY//\//-}.${TARGET_RUNNER_NAME}.service" --no-pager -l -n 80
          REMOTE

      - name: Verify runner is online
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          echo "[repair] Runner service started; verify repository runner status in GitHub Actions."
