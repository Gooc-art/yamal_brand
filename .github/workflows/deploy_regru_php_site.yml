name: Deploy REG.RU PHP Catalog Site

on:
  workflow_dispatch:

concurrency:
  group: deploy-regru-php-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REMOTE_HOST: ${{ secrets.REGRU_HOST }}
      REMOTE_USER: ${{ secrets.REGRU_USER }}
      REMOTE_DIR: ${{ secrets.REGRU_TARGET_DIR }}
      SSH_PASSWORD: ${{ secrets.REGRU_PASSWORD }}
      SSH_PORT: 22
      CONSULTANT_LLM_ENABLED: ${{ secrets.CONSULTANT_LLM_ENABLED }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      OPENAI_REASONING_EFFORT: ${{ secrets.OPENAI_REASONING_EFFORT }}
      OPENAI_MAX_OUTPUT_TOKENS: ${{ secrets.OPENAI_MAX_OUTPUT_TOKENS }}
      OPENAI_TIMEOUT_SECONDS: ${{ secrets.OPENAI_TIMEOUT_SECONDS }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_ORG_ID: ${{ secrets.OPENAI_ORG_ID }}
      OPENAI_PROJECT_ID: ${{ secrets.OPENAI_PROJECT_ID }}
      ADMIN_EMAIL: ${{ secrets.YAMAL_SITE_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.YAMAL_SITE_ADMIN_PASSWORD }}
      ADMIN_PASSWORD_HASH: ${{ secrets.YAMAL_SITE_ADMIN_PASSWORD_HASH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deploy dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Deploy PHP catalog site to REG.RU
        run: |
          chmod +x scripts/deploy_regru_php_site.sh
          ./scripts/deploy_regru_php_site.sh
