name: Migrate Yamal MAX Bot To BOTSGSN

on:
  workflow_dispatch:
    inputs:
      start_new_service:
        description: "Start max_yamal_bot.service on BOTSGSN after deploy"
        required: false
        default: "0"
      stop_old_service:
        description: "Stop max_yamal_bot.service on the old runner after the new service is healthy"
        required: false
        default: "0"
      deploy_dir:
        description: "Deploy directory on BOTSGSN"
        required: false
        default: "/home/localadmin/yamal_brand"

concurrency:
  group: migrate-yamal-botsgsn
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: [self-hosted, linux, yamal-max-prod]
    env:
      OLD_DEPLOY_DIR: /home/sergey/yamal_brand
      BOTSGSN_HOST: 10.10.68.10
      BOTSGSN_USER: localadmin
      BOTSGSN_PASSWORD: ${{ secrets.BOTSGSN_PASSWORD }}
      DEPLOY_DIR: ${{ github.event.inputs.deploy_dir || '/home/localadmin/yamal_brand' }}
      DEPLOY_SERVICE: max_yamal_bot.service
      START_NEW_SERVICE: ${{ github.event.inputs.start_new_service || '0' }}
      STOP_OLD_SERVICE: ${{ github.event.inputs.stop_old_service || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate migration inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${BOTSGSN_PASSWORD}"
          test -n "${BOTSGSN_PASSWORD}" || { echo "Missing secret BOTSGSN_PASSWORD" >&2; exit 1; }
          test -f "${OLD_DEPLOY_DIR}/max_bot_sqlite/.env"
          test -d "${OLD_DEPLOY_DIR}/input/Макеты1"
          test "${START_NEW_SERVICE}" = "0" -o "${START_NEW_SERVICE}" = "1"
          test "${STOP_OLD_SERVICE}" = "0" -o "${STOP_OLD_SERVICE}" = "1"

      - name: Prepare SSH helpers
        shell: bash
        run: |
          set -euo pipefail
          askpass="${RUNNER_TEMP}/botsgsn_askpass.sh"
          cat >"${askpass}" <<'EOF'
          #!/usr/bin/env sh
          printf '%s\n' "$BOTSGSN_PASSWORD"
          EOF
          chmod 700 "${askpass}"
          echo "SSH_ASKPASS=${askpass}" >> "${GITHUB_ENV}"
          echo "SSH_ASKPASS_REQUIRE=force" >> "${GITHUB_ENV}"
          echo "DISPLAY=none" >> "${GITHUB_ENV}"

      - name: Prepare BOTSGSN deploy directory
        shell: bash
        run: |
          set -euo pipefail
          remote_env="BOTSGSN_PASSWORD=$(printf '%q' "${BOTSGSN_PASSWORD}") DEPLOY_DIR=$(printf '%q' "${DEPLOY_DIR}")"
          setsid -w ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            "${BOTSGSN_USER}@${BOTSGSN_HOST}" \
            "${remote_env} bash -s" <<'REMOTE'
          set -euo pipefail
          printf '%s\n' "${BOTSGSN_PASSWORD}" | sudo -S true
          mkdir -p "${DEPLOY_DIR}"
          chmod 755 "${DEPLOY_DIR}"
          REMOTE

      - name: Sync repository code to BOTSGSN
        shell: bash
        run: |
          set -euo pipefail
          export RSYNC_RSH="ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20"
          setsid -w rsync -az --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "max_bot_sqlite/.env" \
            --exclude "max_bot_sqlite/node_modules/" \
            --exclude "input/" \
            --exclude "*.db" \
            ./ "${BOTSGSN_USER}@${BOTSGSN_HOST}:${DEPLOY_DIR}/"

      - name: Sync runtime data to BOTSGSN
        shell: bash
        run: |
          set -euo pipefail
          remote_env="BOTSGSN_PASSWORD=$(printf '%q' "${BOTSGSN_PASSWORD}") DEPLOY_DIR=$(printf '%q' "${DEPLOY_DIR}")"
          setsid -w ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            "${BOTSGSN_USER}@${BOTSGSN_HOST}" \
            "${remote_env} bash -s" <<'REMOTE'
          set -euo pipefail
          mkdir -p "${DEPLOY_DIR}/input/Макеты1" "${DEPLOY_DIR}/max_bot_sqlite" "${DEPLOY_DIR}/.runtime/node"
          REMOTE
          export RSYNC_RSH="ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o ConnectTimeout=20"
          setsid -w rsync -az --delete "${OLD_DEPLOY_DIR}/input/Макеты1/" \
            "${BOTSGSN_USER}@${BOTSGSN_HOST}:${DEPLOY_DIR}/input/Макеты1/"
          setsid -w rsync -az "${OLD_DEPLOY_DIR}/max_bot_sqlite/.env" \
            "${BOTSGSN_USER}@${BOTSGSN_HOST}:${DEPLOY_DIR}/max_bot_sqlite/.env"
          if [[ -f "${OLD_DEPLOY_DIR}/max_catalog.db" ]]; then
            setsid -w rsync -az "${OLD_DEPLOY_DIR}/max_catalog.db" \
              "${BOTSGSN_USER}@${BOTSGSN_HOST}:${DEPLOY_DIR}/max_catalog.db"
          fi
          if [[ -f "${OLD_DEPLOY_DIR}/max_bot_runtime.db" ]]; then
            setsid -w rsync -az "${OLD_DEPLOY_DIR}/max_bot_runtime.db" \
              "${BOTSGSN_USER}@${BOTSGSN_HOST}:${DEPLOY_DIR}/max_bot_runtime.db"
          fi
          if [[ -d "${OLD_DEPLOY_DIR}/.runtime/node" ]]; then
            setsid -w rsync -az --delete "${OLD_DEPLOY_DIR}/.runtime/node/" \
              "${BOTSGSN_USER}@${BOTSGSN_HOST}:${DEPLOY_DIR}/.runtime/node/"
          fi

      - name: Configure and verify BOTSGSN service
        shell: bash
        run: |
          set -euo pipefail
          remote_env="BOTSGSN_PASSWORD=$(printf '%q' "${BOTSGSN_PASSWORD}") DEPLOY_DIR=$(printf '%q' "${DEPLOY_DIR}") DEPLOY_SERVICE=$(printf '%q' "${DEPLOY_SERVICE}") START_NEW_SERVICE=$(printf '%q' "${START_NEW_SERVICE}")"
          setsid -w ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            "${BOTSGSN_USER}@${BOTSGSN_HOST}" \
            "${remote_env} bash -s" <<'REMOTE'
          set -euo pipefail
          printf '%s\n' "${BOTSGSN_PASSWORD}" | sudo -S true

          python3 - <<PY
          from pathlib import Path

          env_path = Path("${DEPLOY_DIR}/max_bot_sqlite/.env")
          updates = {
              "CATALOG_DB_PATH": "${DEPLOY_DIR}/max_catalog.db",
              "RUNTIME_DB_PATH": "${DEPLOY_DIR}/max_bot_runtime.db",
              "CATALOG_ROOT_PATH": "${DEPLOY_DIR}/input/Макеты1",
          }
          lines = env_path.read_text(encoding="utf-8").splitlines()
          seen = set()
          result = []
          for line in lines:
              if "=" not in line or line.lstrip().startswith("#"):
                  result.append(line)
                  continue
              key, _value = line.split("=", 1)
              if key in updates:
                  result.append(f"{key}={updates[key]}")
                  seen.add(key)
              else:
                  result.append(line)
          for key, value in updates.items():
              if key not in seen:
                  result.append(f"{key}={value}")
          env_path.write_text("\n".join(result) + "\n", encoding="utf-8")
          PY

          chmod 600 "${DEPLOY_DIR}/max_bot_sqlite/.env"

          if [[ ! -x "${DEPLOY_DIR}/.runtime/node/bin/node" || ! -x "${DEPLOY_DIR}/.runtime/node/bin/npm" ]]; then
            arch="$(uname -m)"
            case "${arch}" in
              x86_64|amd64) node_arch="x64" ;;
              aarch64|arm64) node_arch="arm64" ;;
              *) echo "unsupported architecture: ${arch}" >&2; exit 1 ;;
            esac
            node_version="20.11.1"
            node_dist="node-v${node_version}-linux-${node_arch}"
            archive="${node_dist}.tar.xz"
            tmp_dir="$(mktemp -d)"
            curl -fsSL "https://nodejs.org/dist/v${node_version}/${archive}" -o "${tmp_dir}/${archive}"
            tar -xf "${tmp_dir}/${archive}" -C "${tmp_dir}"
            mkdir -p "${DEPLOY_DIR}/.runtime"
            rm -rf "${DEPLOY_DIR}/.runtime/${node_dist}" "${DEPLOY_DIR}/.runtime/node"
            mv "${tmp_dir}/${node_dist}" "${DEPLOY_DIR}/.runtime/${node_dist}"
            ln -sfn "${DEPLOY_DIR}/.runtime/${node_dist}" "${DEPLOY_DIR}/.runtime/node"
            rm -rf "${tmp_dir}"
          fi
          export PATH="${DEPLOY_DIR}/.runtime/node/bin:${PATH}"

          cd "${DEPLOY_DIR}/max_bot_sqlite"
          if [[ -f package-lock.json ]]; then
            "${DEPLOY_DIR}/.runtime/node/bin/npm" ci --no-audit --no-fund
          else
            "${DEPLOY_DIR}/.runtime/node/bin/npm" install --no-audit --no-fund
          fi

          python3 "${DEPLOY_DIR}/scripts/build_sqlite_catalog.py" \
            --source "${DEPLOY_DIR}/input/Макеты1" \
            --db "${DEPLOY_DIR}/max_catalog.db"

          unit_tmp="$(mktemp)"
          cat >"${unit_tmp}" <<EOF
          [Unit]
          Description=YAMAL MAX bot (SQLite catalog)
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=${DEPLOY_DIR}/max_bot_sqlite
          EnvironmentFile=${DEPLOY_DIR}/max_bot_sqlite/.env
          Environment=NODE_ENV=production
          ExecStart=${DEPLOY_DIR}/.runtime/node/bin/node ${DEPLOY_DIR}/max_bot_sqlite/src/bot.js
          Restart=always
          RestartSec=5
          SyslogIdentifier=max_yamal_bot
          User=${USER}
          Group=${USER}

          [Install]
          WantedBy=multi-user.target
          EOF
          printf '%s\n' "${BOTSGSN_PASSWORD}" | sudo -S cp "${unit_tmp}" "/etc/systemd/system/${DEPLOY_SERVICE}"
          rm -f "${unit_tmp}"

          printf '%s\n' "${BOTSGSN_PASSWORD}" | sudo -S systemctl daemon-reload
          printf '%s\n' "${BOTSGSN_PASSWORD}" | sudo -S systemctl enable "${DEPLOY_SERVICE}"
          if [[ "${START_NEW_SERVICE}" == "1" ]]; then
            printf '%s\n' "${BOTSGSN_PASSWORD}" | sudo -S systemctl restart "${DEPLOY_SERVICE}"
            printf '%s\n' "${BOTSGSN_PASSWORD}" | sudo -S systemctl status "${DEPLOY_SERVICE}" --no-pager -l -n 80
          else
            echo "[migrate] New service installed but not started (start_new_service=0)"
            printf '%s\n' "${BOTSGSN_PASSWORD}" | sudo -S systemctl status "${DEPLOY_SERVICE}" --no-pager -l -n 30 || true
          fi

          test -f "${DEPLOY_DIR}/max_catalog.db"
          test -d "${DEPLOY_DIR}/input/Макеты1"
          "${DEPLOY_DIR}/.runtime/node/bin/node" --version
          ls -lh "${DEPLOY_DIR}/max_catalog.db" "${DEPLOY_DIR}/max_bot_runtime.db" 2>/dev/null || true
          REMOTE

      - name: Stop old service after successful BOTSGSN start
        if: ${{ github.event.inputs.stop_old_service == '1' && github.event.inputs.start_new_service == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo -n systemctl stop max_yamal_bot.service
          sudo -n systemctl status max_yamal_bot.service --no-pager -l -n 30 || true
