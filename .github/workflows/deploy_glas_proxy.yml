name: Deploy glasAiFake REG.RU Proxy

on:
  workflow_dispatch:
    inputs:
      upstream:
        description: "glasAiFake upstream base URL"
        required: true
        default: "https://b4fa68ab10b63a.lhr.life"

concurrency:
  group: deploy-glas-proxy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REMOTE_HOST: ${{ secrets.REGRU_HOST }}
      REMOTE_USER: ${{ secrets.REGRU_USER }}
      REMOTE_DIR: ${{ secrets.REGRU_TARGET_DIR }}
      REMOTE_SITE_URL: ${{ secrets.REGRU_SITE_URL }}
      SSH_PASSWORD: ${{ secrets.REGRU_PASSWORD }}
      GLAS_PROXY_UPSTREAM: ${{ inputs.upstream }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deploy dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Deploy proxy file
        run: |
          set -euo pipefail
          export SSHPASS="${SSH_PASSWORD}"
          sshpass -e rsync -az \
            -e "ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=15" \
            yamal_catalog_site_php/glas_proxy.php \
            "${REMOTE_USER}@${REMOTE_HOST}:${REMOTE_DIR}/glas_proxy.php"
          sshpass -e ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            "${REMOTE_USER}@${REMOTE_HOST}" \
            "ENV_FILE='${REMOTE_DIR}/.env'; TMP_FILE=\"\$ENV_FILE.tmp\"; grep -v '^GLAS_PROXY_UPSTREAM=' \"\$ENV_FILE\" > \"\$TMP_FILE\" 2>/dev/null || true; printf '%s=%s\n' 'GLAS_PROXY_UPSTREAM' '${GLAS_PROXY_UPSTREAM}' >> \"\$TMP_FILE\"; mv \"\$TMP_FILE\" \"\$ENV_FILE\""

      - name: Verify proxy
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import ssl
          import urllib.request

          base = os.environ["REMOTE_SITE_URL"].rstrip("/")
          url = base + "/glas_proxy.php?path=health"
          context = ssl._create_unverified_context()
          with urllib.request.urlopen(url, context=context, timeout=20) as response:
              payload = json.load(response)
          assert payload.get("ok") is True, payload
          print(url)
          PY
