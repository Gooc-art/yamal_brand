name: Diagnose Runner Filesystem

on:
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: Hours of service journal to inspect
        required: false
        default: '12'
      journal_lines:
        description: Number of recent journal lines to print
        required: false
        default: '120'

jobs:
  diagnose:
    runs-on: [self-hosted, linux, yamal-max-prod]
    env:
      LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '12' }}
      JOURNAL_LINES: ${{ github.event.inputs.journal_lines || '120' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Basic context
        run: |
          set -x
          whoami
          id
          hostname
          pwd
          command -v cp
          command -v sudo || true
          sudo -n systemctl --version || true

      - name: Inspect likely paths
        run: |
          set -x
          ls -ld /home /home/sergey || true
          ls -la /home/sergey || true
          ls -ld /root || true
          ls -ld /root/projects || true
          ls -ld /root/projects/yamal_brand || true
          ls -ld /root/projects/yamal_brand/input || true
          ls -ld /home/sergey/yamal_brand || true
          ls -ld /home/sergey/yamal_brand/input || true
          ls -ld /home/sergey/yamal_brand/input/Макеты1 || true

      - name: Search for catalog folder
        run: |
          set -x
          find /home -maxdepth 5 -type d -name 'Макеты1' 2>/dev/null | sed -n '1,50p'
          find /opt -maxdepth 5 -type d -name 'Макеты1' 2>/dev/null | sed -n '1,50p'
          find /srv -maxdepth 5 -type d -name 'Макеты1' 2>/dev/null | sed -n '1,50p'

      - name: Test legacy copy access
        run: |
          set -x
          mkdir -p /tmp/yamal-diag
          sudo -n cp -R /root/projects/yamal_brand/input/Макеты1 /tmp/yamal-diag/ 2>&1 || true
          ls -la /tmp/yamal-diag || true

      - name: Inspect bot process and service
        run: |
          set -x
          ./scripts/diagnose_bot_service.sh max_yamal_bot.service
          crontab -l 2>/dev/null | sed -n '1,20p' || true
