name: Diagnose REG.RU aieasytable root

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Inspect REG.RU paths
        env:
          REMOTE_HOST: ${{ secrets.REGRU_HOST }}
          REMOTE_USER: ${{ secrets.REGRU_USER }}
          REMOTE_DIR: ${{ secrets.REGRU_TARGET_DIR }}
          SSH_PASSWORD: ${{ secrets.REGRU_PASSWORD }}
          SSH_PORT: 22
        run: |
          set -euo pipefail
          export SSHPASS="${SSH_PASSWORD}"
          SSH_OPTS="-p ${SSH_PORT} -o StrictHostKeyChecking=no -o ConnectTimeout=15"

          sshpass -e ssh ${SSH_OPTS} "${REMOTE_USER}@${REMOTE_HOST}" '
            set -e
            canonical="/var/www/'"${REMOTE_USER}"'/data/www/aieasytable.ru"
            configured="'"${REMOTE_DIR}"'"

            echo "whoami=$(whoami)"
            echo "pwd=$(pwd)"
            echo "home=$HOME"
            echo "canonical_exists=$([ -d "$canonical" ] && echo yes || echo no)"
            echo "canonical_index=$([ -f "$canonical/index.html" ] && echo yes || echo no)"
            echo "configured_exists=$([ -d "$configured" ] && echo yes || echo no)"
            echo "configured_index=$([ -f "$configured/index.html" ] && echo yes || echo no)"

            echo "canonical_index_stat:"
            stat -c "%s %y" "$canonical/index.html" 2>/dev/null || true
            echo "configured_index_stat:"
            stat -c "%s %y" "$configured/index.html" 2>/dev/null || true

            echo "public_old_marker_files:"
            find "$HOME" /var/www /www -maxdepth 9 -type f -name index.html -not -path "*/_backup/*" -exec grep -l "main-DHCVE66B" {} \; 2>/dev/null || true

            echo "new_marker_files:"
            find "$HOME" /var/www /www -maxdepth 9 -type f -name index.html -not -path "*/_backup/*" -exec grep -l "main-7NJNZ5PN" {} \; 2>/dev/null || true

            echo "new_js_files:"
            find "$HOME" /var/www /www -maxdepth 9 -type f -name "main-7NJNZ5PN.js" -not -path "*/_backup/*" 2>/dev/null || true

            echo "aieasytable_named_dirs_count:"
            find "$HOME" /var/www /www -maxdepth 8 -type d -name aieasytable.ru 2>/dev/null | wc -l

            echo "aieasytable_named_dirs:"
            find "$HOME" /var/www /www -maxdepth 8 -type d -name aieasytable.ru 2>/dev/null || true
          '
